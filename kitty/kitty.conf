font_family      Hack
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 9.0

# font size management 
map ctrl+shift+backspace change_font_size all 0

enabled_layouts horizontal

# terminal opacity and blur
background_opacity 1.0
background_blur 1

# advance 
term xterm-kitty

# terminal bell
enable_audio_bell no

# scrollback
scrollback_lines 5000
wheel_scroll_multiplier 3.0
scrollbar always
scrollbar_interactive yes
scrollbar_jump_on_click yes
scrollbar_width 0.8
scrollbar_handle_color #d7827e

# tab bar customization
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_edge bottom
tab_bar_align left
active_tab_font_style   bold
inactive_tab_font_style normal
bell_on_tab             yes
tab_bar_edge            bottom
tab_title_template      {index}: {title}

# window customization
active_border_color #434871

# tab management
map ctrl+shift+t new_tab
map ctrl+shift+right next_tab
map ctrl+shift+left previous_tab
map ctrl+shift+q close_tab

# nvim integration 
map --allow-fallback=shifted,ascii ctrl+shift+z+enter new_window
map --allow-fallback=shifted,ascii ctrl+shift+z+q close_window
map --allow-fallback=shifted,ascii ctrl+shift+z+left next_window
map --allow-fallback=shifted,ascii ctrl+shift+z+right previous_window
map --when-focus-on var:IS_VIM=true ctrl+shift+z+left
map --when-focus-on var:IS_VIM=true ctrl+shift+z+right

allow_remote_control yes
listen_on unix:@mykitty

